name: NuGet

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "packages-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  ARTIFACTS_DIR: artifacts/nuget
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build-pack:
    name: Build, Test, Pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore InteractionFlow.slnx

      - name: Build
        run: dotnet build InteractionFlow.slnx --configuration $env:CONFIGURATION --no-restore

      - name: Test
        run: dotnet test InteractionFlow.slnx --configuration $env:CONFIGURATION --no-build

      - name: Pack Core
        if: github.event_name != 'pull_request'
        run: dotnet pack InteractionFlow.Core/InteractionFlow.Core.csproj --configuration $env:CONFIGURATION --no-build --output $env:ARTIFACTS_DIR

      - name: Pack Standard
        if: github.event_name != 'pull_request'
        run: dotnet pack InteractionFlow.Standard/InteractionFlow.Standard.csproj --configuration $env:CONFIGURATION --no-build --output $env:ARTIFACTS_DIR

      - name: Pack Analyzers
        if: github.event_name != 'pull_request'
        run: dotnet pack InteractionFlow.Analyzers/InteractionFlow.Analyzers.csproj --configuration $env:CONFIGURATION --no-build --output $env:ARTIFACTS_DIR

      - name: List packages
        if: github.event_name != 'pull_request'
        run: Get-ChildItem $env:ARTIFACTS_DIR | Select-Object Name, Length

      - name: Upload packages
        if: startsWith(github.ref, 'refs/tags/packages-')
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*

  publish:
    name: Publish
    runs-on: windows-latest
    needs: build-pack
    if: startsWith(github.ref, 'refs/tags/packages-')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate package release tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^packages-\d{4}\.\d{2}\.\d{2}(\.\d+)?$') {
            throw "Package release tag must match packages-YYYY.MM.DD or packages-YYYY.MM.DD.N. Actual: $tag"
          }

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: List packages to publish
        run: Get-ChildItem $env:ARTIFACTS_DIR | Select-Object Name, Length

      - name: Validate publish packages
        run: |
          $packages = @(Get-ChildItem $env:ARTIFACTS_DIR -Filter *.nupkg)
          if ($packages.Count -eq 0) {
            throw "No .nupkg files were found. Publish requires at least one package."
          }

          $packages | Select-Object Name, Length

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: |
          Get-ChildItem $env:ARTIFACTS_DIR -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source $env:NUGET_SOURCE --skip-duplicate
          }

          Get-ChildItem $env:ARTIFACTS_DIR -Filter *.snupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source $env:NUGET_SOURCE --skip-duplicate
          }
